<!DOCTYPE html>
<html lang="ko">

<head>
    <base target="_top">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>11월 25일 저녁 신청 받기</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4f1ec;
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
            color: #2b2b2b;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: #fff;
            border-radius: 16px;
            padding: 32px 28px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, .08);
        }

        h1 {
            font-size: 22px;
            margin: 0 0 6px;
        }

        .sub {
            color: #777;
            font-size: 14px;
            margin: 0 0 24px;
        }

        label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            margin: 16px 0 6px;
        }

        .req {
            color: #e05a3a;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
            font-family: inherit;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #e07a3a;
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 14px;
            border: 0;
            border-radius: 10px;
            background: #e07a3a;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        button:disabled {
            background: #ccc;
            cursor: default;
        }

        .error {
            color: #d33;
            font-size: 14px;
            margin-top: 12px;
            min-height: 18px;
        }

        .done {
            text-align: center;
            padding: 40px 0;
            display: none;
        }

        .done .emoji {
            font-size: 48px;
        }

        .done p {
            font-size: 20px;
            font-weight: 700;
            margin: 16px 0 0;
        }
    </style>
</head>

<body>
    <div class="card">
        <form id="form">
            <h1>11월 25일 저녁 신청 받기</h1>
            <p class="sub">원하는 음식을 알려주세요.</p>

            <label for="name">이름 <span class="req">*</span></label>
            <input id="name" name="name" maxlength="50" required>

            <label for="food">음식 <span class="req">*</span></label>
            <input id="food" name="food" maxlength="100" required>

            <label for="message">하고싶은 말</label>
            <textarea id="message" name="message" maxlength="500"></textarea>

            <button type="submit" id="submitBtn">확인</button>
            <div class="error" id="error"></div>
        </form>

        <div class="done" id="done">
            <div class="emoji">🙏</div>
            <p>답장 감사합니다</p>
        </div>
    </div>

    <script>
        const form = document.getElementById('form');
        const btn = document.getElementById('submitBtn');
        const errorEl = document.getElementById('error');

        form.addEventListener('submit', function (e) {
            e.preventDefault();
            errorEl.textContent = '';

            const data = {
                name: form.name.value.trim(),
                food: form.food.value.trim(),
                message: form.message.value.trim()
            };
            if (!data.name || !data.food) {
                errorEl.textContent = '이름과 음식은 꼭 입력해주세요.';
                return;
            }

            btn.disabled = true;
            btn.textContent = '전송 중...';

            google.script.run
                .withSuccessHandler(function () {
                    form.style.display = 'none';
                    document.getElementById('done').style.display = 'block';
                })
                .withFailureHandler(function (err) {
                    btn.disabled = false;
                    btn.textContent = '확인';
                    errorEl.textContent = '저장 중 오류가 발생했어요: ' + (err && err.message ? err.message : err);
                })
                .submitForm(data);
        });
    </script>
</body>

</html>
